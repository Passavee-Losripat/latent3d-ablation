representation: triplane

data:
  root: data/
  processed_dir: data/processed/tsdf_64/   # same TSDF data as TSDF variant — fair comparison
  voxel_dir: data/processed/voxel_64/
  splits_dir: data/splits/
  augment: true

model:
  encoder_dim: 256
  codebook_size: 512
  latent_channels: 64
  decoder: triplane
  resolution: 64

training:
  batch_size: 16
  num_steps: 50000
  lr: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  mixed_precision: true
  grad_checkpoint: false
  save_every: 5000
  checkpoint_dir: checkpoints/triplane/

loss:
  reconstruction: l1
  surface_weight: 10.0      # same surface weighting as TSDF — fair comparison
  surface_threshold: 0.3
  vq_weight: 0.0
  commitment_weight: 0.25

evaluation:
  metrics: [chamfer, iou, fscore, mmd, coverage, jsd]
  fscore_threshold: 0.01
  iso_threshold: 0.0        # TSDF surface at 0 (same as TSDF variant)
  n_generate: 100
  n_points: 2048

diffusion:
  latent_dir: data/latents/triplane/
  latent_stats_path: checkpoints/triplane/latent_stats.npz
  checkpoint_dir: checkpoints/triplane_diffusion/
  timesteps: 1000
  num_steps: 100000
  lr: 2.0e-4
  save_every: 10000
  ddim_steps: 50
