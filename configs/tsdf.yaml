representation: tsdf

data:
  root: data/
  processed_dir: data/processed/tsdf_64/
  voxel_dir: data/processed/voxel_64/
  splits_dir: data/splits/
  augment: true

model:
  encoder_dim: 256
  codebook_size: 512
  latent_channels: 64        # 256→64 projection; compact latent for diffusion
  decoder: tsdf
  resolution: 64             # voxel resolution; drives encoder depth

training:
  batch_size: 4               # TITAN X 12GB constraint
  num_steps: 50000
  lr: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  mixed_precision: true
  grad_checkpoint: false      # enable if OOM
  save_every: 5000
  checkpoint_dir: checkpoints/tsdf/

loss:
  reconstruction: l1
  surface_weight: 10.0        # near-surface voxels weighted this much more
  surface_threshold: 0.3      # |tsdf| < this is treated as near-surface
  vq_weight: 0.0              # EMA codebook needs no explicit codebook loss term
  commitment_weight: 0.25

evaluation:
  metrics: [chamfer, iou, fscore, mmd, coverage, jsd]
  fscore_threshold: 0.01
  n_generate: 100
  n_points: 2048

diffusion:
  latent_dir: data/latents/tsdf/
  latent_stats_path: checkpoints/tsdf/latent_stats.npz
  checkpoint_dir: checkpoints/tsdf_diffusion/
  timesteps: 1000
  num_steps: 100000
  lr: 2.0e-4
  save_every: 10000
  ddim_steps: 50
